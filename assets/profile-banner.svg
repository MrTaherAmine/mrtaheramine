<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="0" x2="1520" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111E"/>
      <stop offset="0.52" stop-color="#0A1728"/>
      <stop offset="1" stop-color="#08111F"/>
    </linearGradient>

    <linearGradient id="accent" x1="235" y1="168" x2="1210" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D4FF"/>
      <stop offset="0.5" stop-color="#11B9A8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(1310 120) rotate(145) scale(430 330)">
      <stop stop-color="#00D4FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(260 520) rotate(-40) scale(460 300)">
      <stop stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#8FDFFF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="32" fill="url(#grid)"/>
  <rect width="1600" height="520" rx="32" fill="url(#glow1)"/>
  <rect width="1600" height="520" rx="32" fill="url(#glow2)"/>

